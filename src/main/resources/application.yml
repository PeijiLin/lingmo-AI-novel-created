server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      enabled: true
      force: true
      charset: UTF-8
  shutdown: graceful


spring:
  application:
    name: "novel-creation-platform"
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: '默认分组'
      paths-to-match: '/**'
      packages-to-scan: com.linpj.novel.create.controller
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-open-api: true